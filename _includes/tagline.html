{% comment %}
This tagline will appear in your homepage.
The content comes from _data/home.yaml and can be edited in the CMS under "Home page".
{% endcomment %}

<section class="grid-container usa-section usa-prose">
  <div class="grid-row grid-gap">
    <div class="tablet:grid-col-4">
      <h2 class="font-heading-xl margin-top-0 tablet:margin-bottom-0">{{ home.tagline.heading | escape }}</h2>
    </div>
    <div class="tablet:grid-col-8 usa-prose">
      {{ home.tagline.body | markdown }}
    </div>
  </div>
</section>
